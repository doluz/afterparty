<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 260px;
        padding: 16px;
        background: #17121c;
        color: #f2ecf5;
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .band {
        height: 10px;
        border-radius: 3px;
        background: #ff7a1a;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 12px;
        color: #a99bb3;
      }
      a {
        display: inline-block;
        padding: 7px 12px;
        border-radius: 6px;
        background: #ff7a1a;
        color: #1b1208;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="band"></div>
    <h1>Afterparty Connector is installed</h1>
    <p>Go back to Afterparty and select Connect Partiful. This extension does nothing on its own.</p>
    <a href="http://localhost:8080/onboarding" target="_blank">Open Afterparty</a>
  </body>
</html>
